[package]
name = "rust-note-search"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
jieba-rs = "0.7"
lopdf = "0.34"
open = "5"
pdf-extract = "0.7"
rayon = "1.10"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
unicode-width = "0.2"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.14"
